name: Site Doctor

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly safety net
  workflow_dispatch:

permissions:
  contents: write

# Business-Fox pushes one file per commit, so wait for the burst to finish
# and only let the newest run do the work.
concurrency:
  group: site-doctor
  cancel-in-progress: true

jobs:
  doctor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Let Business-Fox finish publishing
        if: github.event_name == 'push'
        run: sleep 180
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and repair the store
        run: python tools/site_doctor.py
      - name: Commit fixes
        run: |
          git config user.name "Site Doctor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Store is healthy"; exit 0; fi
          git commit -m "Site Doctor: automatic store repairs" -m "$(sed -n '/## Fixed this run/,/## Problems found/p' SITE_REPORT.md | head -40)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
