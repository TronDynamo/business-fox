name: Square Links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing payment links
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: python3 tools/square_links.py
      - name: Commit
        run: |
          git config user.name "Square Links"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/new_products.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Square links for new products"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*10)); done
